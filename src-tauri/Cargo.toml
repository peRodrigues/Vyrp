[package]
name = "vyrp"
version = "0.1.1"
description = "Vyrp: ditado por voz para Windows (segura um atalho, fala, o texto é colado no app em foco)"
authors = ["Vyrp"]
edition = "2024"
rust-version = "1.85"
# Há mais de um binário (bench-stt): o app é este.
default-run = "vyrp"

[lib]
# O sufixo `_lib` evita conflito de nome entre lib e bin no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "vyrp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native"] }
cpal = "0.18.2"
whisper-rs = { version = "0.16.0", features = ["tracing_backend"] }
sha2 = "0.11.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Graphics_Gdi",
  "Win32_Security",
] }
# Mídia do sistema durante o ditado (sound/media.rs, V19): volume/mute via COM.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_System_Variant",
  "Win32_System_Ole",
] }

[features]
# GPU para o whisper. Padrão = CPU (o CI compila assim). Release com GPU:
# `npm run tauri build -- --features gpu-vulkan` (exige o Vulkan SDK no build).
gpu-vulkan = ["whisper-rs/vulkan"]
gpu-cuda = ["whisper-rs/cuda"]
# Ferramentas de desenvolvimento (benchmark, diagnóstico): fora do build normal e do
# instalador. Rodar com `cargo run --release --features dev-tools --bin <nome>`.
dev-tools = []

[[bin]]
name = "bench-stt"
path = "src/bin/bench-stt.rs"
required-features = ["dev-tools"]

[[bin]]
name = "diag-desktop"
path = "src/bin/diag-desktop.rs"
required-features = ["dev-tools"]

[[bin]]
name = "diag-transform-hub"
path = "src/bin/diag-transform-hub.rs"
required-features = ["dev-tools"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
