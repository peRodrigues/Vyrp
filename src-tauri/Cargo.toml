[package]
name = "vyrp"
version = "0.1.0"
description = "Vyrp: ditado por voz para Windows (segura um atalho, fala, o texto é colado no app em foco)"
authors = ["Vyrp"]
edition = "2024"
rust-version = "1.85"

[lib]
# O sufixo `_lib` evita conflito de nome entre lib e bin no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "vyrp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
