name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    env:
      # whisper-rs-sys gera bindings com bindgen (libclang) e compila o whisper.cpp
      # com CMake; o windows-latest já traz LLVM e CMake. Build sem GPU (padrão).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Conferir LLVM e CMake
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:LIBCLANG_PATH\libclang.dll")) { throw "libclang.dll não encontrado em $env:LIBCLANG_PATH" }
          cmake --version

      - name: Instalar dependências
        run: npm ci

      - name: Lint (front)
        run: npm run lint

      - name: Lint (Rust)
        run: npm run lint:rust

      - name: Testes (front)
        run: npm test

      - name: Testes (Rust)
        run: npm run test:rust

      - name: Build (release, sem instalador)
        run: npm run tauri build -- --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: vyrp-windows
          path: src-tauri/target/release/vyrp.exe
