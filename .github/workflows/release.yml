name: Release

# Tag `v*` (ex.: v0.2.0) → builda o instalador (CPU), assina os artefatos do updater e
# publica o GitHub Release com o latest.json que o app consulta. Na mesma tag, a variante
# Vulkan (GPU) entra no mesmo Release como asset extra, com o próprio latest-vulkan.json.
# Pré-requisito: secret TAURI_SIGNING_PRIVATE_KEY (conteúdo de vyrp-updater.key; ver README).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      vulkan:
        description: "Gerar também a variante com GPU (Vulkan) como artifact (sem tag = sem Release)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # whisper-rs-sys: bindgen (libclang) + CMake; o windows-latest já traz os dois.
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ("v$($conf.version)" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} não bate com a versão v$($conf.version) do tauri.conf.json"
          }

      - name: Build, assinatura do updater e Release
        # Só na tag: no "Run workflow" sem tag a tauri-action criaria um Release/tag com o
        # nome da branch. Sem tag, o passo seguinte gera só o artifact.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vyrp ${{ github.ref_name }}"
          releaseBody: "Instalador para Windows (CPU). Veja o README para a nota sobre o aviso do SmartScreen."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Chave genérica windows-x86_64 → NSIS (o instalador que recomendamos). O plugin
          # updater v2 procura antes windows-x86_64-nsis / -msi conforme o tipo gravado no exe.
          updaterJsonPreferNsis: true
          # Os artefatos do updater (.sig + latest.json) só aqui, onde existe a chave privada.
          args: --config src-tauri/tauri.release.conf.json

      - name: Build (sem tag, só artifact)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: vyrp-windows-cpu
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Variante com GPU (Vulkan). Na tag: anexa o setup ao mesmo Release (depois do job CPU,
  # que cria o Release) e publica latest-vulkan.json. O build Vulkan consulta esse arquivo
  # (tauri.vulkan.conf.json), então nunca se "atualiza" para o build CPU, e o latest.json
  # do CPU fica intacto. Pelo "Run workflow" sem tag: só o artifact.
  windows-vulkan:
    # Roda se o job CPU deu certo ou foi pulado (nunca depois de uma falha dele).
    if: ${{ !cancelled() && needs.windows-cpu.result != 'failure' && (startsWith(github.ref, 'refs/tags/v') || inputs.vulkan) }}
    needs: windows-cpu
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: false
          cache: true
          stripdown: true

      # O Vulkan do whisper.cpp usa Ninja + o compilador do MSVC no PATH.
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar dependências
        run: npm ci

      - name: Build (Vulkan)
        env:
          CMAKE_GENERATOR: Ninja
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --features gpu-vulkan --config src-tauri/tauri.vulkan.conf.json

      - name: Anexar ao Release (setup Vulkan + latest-vulkan.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $setup = Get-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $sig = Get-Content "$($setup.FullName).sig" -Raw
          # Nome próprio: o setup CPU do mesmo Release tem o nome padrão.
          $name = "Vyrp_${version}_x64-vulkan-setup.exe"
          Copy-Item $setup.FullName $name
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"
          $entry = @{ signature = $sig.Trim(); url = $url }
          [ordered]@{
            version   = $version
            notes     = "Vyrp $tag (GPU/Vulkan)"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64-nsis" = $entry; "windows-x86_64" = $entry }
          } | ConvertTo-Json -Depth 4 | Set-Content latest-vulkan.json -Encoding utf8NoBOM
          gh release upload $tag $name latest-vulkan.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: vyrp-windows-vulkan
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
