name: Release

# Tag `v*` (ex.: v0.2.0) → builda o instalador (CPU), assina os artefatos do updater e
# publica o GitHub Release com o latest.json que o app consulta.
# Pré-requisito: secret TAURI_SIGNING_PRIVATE_KEY (conteúdo de vyrp-updater.key; ver README).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      vulkan:
        description: "Gerar também a variante com GPU (Vulkan)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # whisper-rs-sys: bindgen (libclang) + CMake; o windows-latest já traz os dois.
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ("v$($conf.version)" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} não bate com a versão v$($conf.version) do tauri.conf.json"
          }

      - name: Build, assinatura do updater e Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vyrp ${{ github.ref_name }}"
          releaseBody: "Instalador para Windows (CPU). Veja o README para a nota sobre o aviso do SmartScreen."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Os artefatos do updater (.sig + latest.json) só aqui, onde existe a chave privada.
          args: --config src-tauri/tauri.release.conf.json

  # Variante com GPU: desligada até termos o Vulkan SDK no runner. Sobe só os instaladores
  # (sem latest.json, para o updater continuar no build CPU).
  windows-vulkan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vulkan }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: false
          cache: true
          stripdown: true

      # O Vulkan do whisper.cpp usa Ninja + o compilador do MSVC no PATH.
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar dependências
        run: npm ci

      - name: Build (Vulkan)
        env:
          CMAKE_GENERATOR: Ninja
        run: npm run tauri build -- --features gpu-vulkan

      - uses: actions/upload-artifact@v4
        with:
          name: vyrp-windows-vulkan
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
